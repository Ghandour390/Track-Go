services:
  mock-api:
    build: .
    container_name: trackandgo-mock-api
    ports:
      - "3009:3000"
    volumes:
      - ./db.json:/app/db.json
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://127.0.0.1:3000/colis"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
