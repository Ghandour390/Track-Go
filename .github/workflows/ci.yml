name: CI Track&Go

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Installation des dépendances
        run: npm install

      - name: Vérification du Typage (TypeScript)
        run: npx tsc --noEmit

      - name: Vérification du Linting (ESLint)
        run: npx eslint . --ext .js,.jsx,.ts,.tsx